<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAX OSINT — اكتشف بصمتك الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="bgfx" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>

<div class="wrap">

  <header class="site">
    <div class="logo">
      <div class="mark">Ω</div>
      <div>
        <h1>LAX <span>OSINT</span></h1>
        <span class="tagline" data-i18n="tagline">اكتشف بصمتك الرقمية</span>
      </div>
    </div>
    <div class="topbtns">
      <button class="btn btn-ghost icon-btn" id="btnLang" title="EN / عربي">EN</button>
      <div id="authBtns"></div>
    </div>
  </header>

  <section class="search-box">
    <div class="tabs" id="tabs">
      <button class="tab active" data-type="username" data-ph="placeholder_username" data-help="help_username">
        👤 <span data-i18n="username">يوزرنيم</span>
      </button>
      <button class="tab" data-type="email" data-ph="placeholder_email" data-help="help_email">
        📧 <span data-i18n="email">إيميل</span>
      </button>
      <button class="tab" data-type="phone" data-ph="placeholder_phone" data-help="help_phone">
        📞 <span data-i18n="phone">رقم هاتف</span>
      </button>
    </div>

    <div class="input-row">
      <input id="query" type="text" autocomplete="off" spellcheck="false"
             placeholder="" aria-label="search query">
      <button class="btn btn-primary" id="btnSearch" style="padding:14px 26px;">🔍 <span data-i18n="search">بحث</span></button>
    </div>
    <div class="help" id="searchHelp"></div>

    <div class="quota-bar">
      <span class="quota-chip" id="quotaChip"><span data-i18n="quota">بحوثك اليوم</span>: <b>0/4</b></span>
      <span id="sessionNote">—</span>
    </div>
  </section>

  <div id="status">
    <span class="pulse"></span><span id="statusText" data-i18n="searching">جارٍ البحث…</span>
  </div>

  <section id="log" class="hidden"></section>

  <footer class="site">
    <div class="disclaimer" data-i18n="privacy">
      لا نخزن أي نتائج أو بيانات بحثك. نُسجّل عدد البحوث فقط لحماية الخدمة.
    </div>
    <br>LAX OSINT © 2026
  </footer>
</div>

<!-- =================== النوافذ المنبثقة =================== -->
<div class="overlay" id="overlay">
  <button class="btn btn-ghost icon-btn modal-close" style="position:absolute;top:16px;inset-inline-end:16px;">✕</button>

  <div class="modal" id="m-login" style="display:none;">
    <h3 class="m-title"></h3>
    <p class="m-sub"></p>
    <div class="err"></div>
    <div class="row-email"><input name="email" id="lg-email" type="email" autocomplete="email"></div>
    <div class="row-password"><input name="password" id="lg-password" type="password" autocomplete="current-password"></div>
    <div class="row-code" style="display:none;"><input name="code"></div>
    <button class="btn btn-primary m-submit" style="width:100%;"></button>
    <p class="switch-link"></p>
  </div>

  <div class="modal" id="m-register" style="display:none;">
    <h3 class="m-title"></h3>
    <p class="m-sub"></p>
    <div class="err"></div>
    <div class="row-email"><input name="email" id="rg-email" type="email" autocomplete="email"></div>
    <div class="row-password"><input name="password" id="rg-password" type="password" autocomplete="new-password"></div>
    <div class="row-code" style="display:none;"><input name="code"></div>
    <button class="btn btn-primary m-submit" style="width:100%;"></button>
    <p class="switch-link"></p>
  </div>

  <div class="modal" id="m-pro" style="display:none;">
    <h3 class="m-title"></h3>
    <p class="m-sub"></p>
    <div class="err"></div>
    <div class="row-email" style="display:none;"><input name="email"></div>
    <div class="row-password" style="display:none;"><input name="password"></div>
    <div class="row-code"><input name="code" id="pr-code" type="text" spellcheck="false" autocomplete="off"></div>
    <button class="btn btn-gold m-submit" style="width:100%;"></button>
    <p class="switch-link"></p>
  </div>
</div>

<div id="toasts"></div>

<script src="config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
